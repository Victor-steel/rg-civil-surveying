<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RG Civil Engineering &amp; Surveying · Cinema Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #070b0d;
      --paper: #f4f6f8;
      --gold: #f5cf25;
      --gold-deep: #c49e08;
      --muted: #8c979d;
      --hairline: rgba(255, 255, 255, 0.12);
      --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .cinema-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    /* Cinematic Media Stage (Supports Image or Video Background) */
    .cinema-stage {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      will-change: transform;
      animation: cameraBreathe 18s ease-in-out infinite alternate;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes cameraBreathe {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.03) translate3d(-0.6%, -0.8%, 0); }
    }

    .cinema-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 54%;
      filter: contrast(1.04) saturate(1.03) brightness(0.96);
    }

    /* Soft Atmospheric Edge Vignette to keep bottom UI perfectly legible */
    .cinema-vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(7, 11, 13, 0.88) 0%, rgba(7, 11, 13, 0.35) 20%, transparent 45%),
        linear-gradient(to bottom, rgba(7, 11, 13, 0.65) 0%, transparent 22%),
        radial-gradient(ellipse 95% 85% at 50% 50%, transparent 55%, rgba(7, 11, 13, 0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Subtle Brand Bar */
    .cinema-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(16px, 2.8vw, 28px) clamp(20px, 4vw, 48px);
      z-index: 10;
      pointer-events: none;
    }

    .cinema-brand-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(244, 246, 248, 0.8);
      background: rgba(7, 11, 13, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
    }

    .brand-pip {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold);
      animation: pipPulse 2s ease-in-out infinite;
    }

    @keyframes pipPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .cinema-status {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(244, 246, 248, 0.65);
      background: rgba(7, 11, 13, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
    }

    /* Architectural Viewfinder Framing Brackets */
    .cinema-bracket {
      position: absolute;
      width: 18px;
      height: 18px;
      pointer-events: none;
      z-index: 10;
    }
    .cinema-bracket.tl { top: 24px; left: 24px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
    .cinema-bracket.tr { top: 24px; right: 24px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); }
    .cinema-bracket.bl { bottom: 24px; left: 24px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); }
    .cinema-bracket.br { bottom: 24px; right: 24px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }

    /* Bottom Dock: Completely leaves the tripod and river visible */
    .cinema-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: clamp(24px, 4vw, 44px) clamp(24px, 4.5vw, 52px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 32px;
      z-index: 10;
      pointer-events: none;
    }

    .dock-left {
      max-width: 580px;
    }

    .dock-title {
      font-size: clamp(1.8rem, 3.4vw, 2.75rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      margin-bottom: 8px;
    }

    .dock-title span {
      color: var(--gold);
    }

    .dock-sub {
      font-size: clamp(0.92rem, 1.25vw, 1.06rem);
      color: rgba(244, 246, 248, 0.85);
      line-height: 1.45;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      font-weight: 400;
    }

    .dock-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      flex-shrink: 0;
    }

    .enter-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--gold);
      color: #070b0d;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      padding: 16px 32px;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(245, 207, 37, 0.35), 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
      pointer-events: auto;
      border: none;
    }

    /* Ambient progress sweep filling the button over the 8-second intro */
    .enter-btn-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(7, 11, 13, 0.5);
      width: 0%;
      transition: width 0.15s linear;
    }

    .enter-btn:hover {
      background: #ffd83a;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(245, 207, 37, 0.45);
    }

    /* Seamless page exit animation */
    body {
      transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .enter-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244, 246, 248, 0.65);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 768px) {
      .cinema-media {
        object-position: 74% 54%;
      }
      .cinema-dock {
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
        padding: 24px 20px 20px;
      }
      .dock-title {
        font-size: 1.65rem;
      }
      .dock-sub {
        font-size: 0.88rem;
      }
      .dock-right {
        align-items: stretch;
      }
      .enter-btn {
        justify-content: center;
        width: 100%;
        padding: 14px 24px;
      }
      .enter-hint {
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="cinema-wrap" id="cinemaWrap" onclick="enterSite()">
  <!-- Background Media (Autoplaying native loop video with crisp poster fallback) -->
  <div class="cinema-stage" id="stage">
    <video
      class="cinema-media"
      autoplay
      muted
      loop
      playsinline
      poster="assets/video/cumbria-river-survey-4k-poster.jpg"
      id="bgVideo"
    >
      <source src="assets/video/cumbria-river-survey-4k.mp4" type="video/mp4" />
      <img
        class="cinema-media"
        src="assets/video/cumbria-river-survey-4k-poster.jpg"
        alt="RG Civil Engineering and Surveying Cumbria Fieldwork"
        id="bgImg"
      />
    </video>
  </div>

  <div class="cinema-vignette" aria-hidden="true"></div>

  <!-- Top Status -->
  <header class="cinema-top">
    <div class="cinema-brand-eyebrow">
      <span class="brand-pip"></span>
      <span>Carlisle · Cumbria · Border Regions</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; pointer-events: auto;">
      <div class="cinema-status">
        4K UHD Video · Grounded Tripod Base
      </div>
      <button
        type="button"
        id="autoEnterToggle"
        onclick="toggleAutoEnter(); event.stopPropagation();"
        style="background: rgba(7, 11, 13, 0.65); color: #f4f6f8; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--hairline); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);"
      >
        <span>Auto-Enter: <strong id="autoEnterStatus" style="color: #8c979d;">OFF (Looping)</strong></span>
      </button>
      <button
        type="button"
        id="fullscreenBtn"
        onclick="toggleFullscreen(); event.stopPropagation();"
        style="background: rgba(7, 11, 13, 0.65); color: #f4f6f8; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--hairline); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);"
      >
        <span style="font-size: 13px;">⛶</span>
        <span>Full Screen (F)</span>
      </button>
    </div>
  </header>

  <!-- Viewfinder corners -->
  <div class="cinema-bracket tl"></div>
  <div class="cinema-bracket tr"></div>
  <div class="cinema-bracket bl"></div>
  <div class="cinema-bracket br"></div>

  <!-- Bottom Unobtrusive Dock -->
  <footer class="cinema-dock">
    <div class="dock-left">
      <h1 class="dock-title">
        RG Civil Engineering<br /><span>&amp; Surveying</span>
      </h1>
      <p class="dock-sub">
        Measured on site. Built with confidence across Cumbria, Northumberland and South-West Scotland.
      </p>
    </div>

    <div class="dock-right">
      <button type="button" class="enter-btn" id="enterBtn" onclick="enterSite(); event.stopPropagation();">
        <span>Enter Site</span>
        <span aria-hidden="true">→</span>
        <div class="enter-btn-progress" id="enterProgress"></div>
      </button>
      <div class="enter-hint">Click anywhere, scroll, or wait to enter ↓</div>
    </div>
  </footer>
</div>

<script>
  const video = document.getElementById('bgVideo');
  const enterProgress = document.getElementById('enterProgress');
  const autoEnterStatus = document.getElementById('autoEnterStatus');
  let hasEntered = false;
  let autoEnterEnabled = false; // Off by default so you can watch and inspect the loop hands-free!
  const AUTO_ENTER_TIME = 7.8;

  function toggleAutoEnter() {
    autoEnterEnabled = !autoEnterEnabled;
    if (autoEnterStatus) {
      autoEnterStatus.textContent = autoEnterEnabled ? 'ON (7.8s)' : 'OFF (Looping)';
      autoEnterStatus.style.color = autoEnterEnabled ? '#f5cf25' : '#8c979d';
    }
  }

  function enterSite() {
    if (hasEntered) return;
    hasEntered = true;
    document.body.classList.add('is-leaving');
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 600);
  }

  // Update progress bar and trigger seamless auto-entrance ONLY if enabled
  if (video) {
    video.addEventListener('timeupdate', () => {
      const progress = Math.min(100, (video.currentTime / AUTO_ENTER_TIME) * 100);
      if (enterProgress) {
        enterProgress.style.width = autoEnterEnabled ? progress + '%' : '0%';
      }
      if (autoEnterEnabled && !hasEntered && video.currentTime >= AUTO_ENTER_TIME) {
        enterSite();
      }
    });
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  // Double click toggles true fullscreen
  window.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    toggleFullscreen();
  });

  // Smooth keyboard & wheel transition
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      toggleFullscreen();
      return;
    }
    if (['Enter', ' ', 'ArrowDown'].includes(e.key)) {
      enterSite();
    }
  });

  window.addEventListener('wheel', (e) => {
    if (e.deltaY > 20) {
      enterSite();
    }
  }, { passive: true });
</script>

</body>
</html>
