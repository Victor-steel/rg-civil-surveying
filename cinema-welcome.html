<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070b0d" />
  <title>RG Civil Engineering &amp; Surveying</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #070b0d;
      --graphite: #1c2024;
      -- graphite-edge: #2c3137;
      --paper: #f4f6f8;
      --gold: #f5cf25;
      --gold-warm: #e5b916;
      --muted: rgba(244, 246, 248, 0.88);
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    /* Full-Viewport Welcome Container */
    .cinema-welcome {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vh, 56px) clamp(20px, 5vw, 64px);
      overflow: hidden;
      isolation: isolate;
    }

    /* Cinematic Landscape Background */
    .cinema-stage {
      position: absolute;
      inset: -2.5%;
      width: 105%;
      height: 105%;
      z-index: -2;
      pointer-events: none;
      will-change: transform;
      animation: stageBreathe 20s ease-in-out infinite alternate;
    }

    @keyframes stageBreathe {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.028) translate3d(-0.5%, -0.6%, 0); }
    }

    .cinema-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 46% 58%;
      filter: contrast(1.03) saturate(1.03) brightness(0.98);
    }

    /* Subtle Dark Gradient Behind Text Only — Keeps Compass Interior 100% Clear & Bright */
    .cinema-backdrop {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 48% 32% at 50% 66%,
          rgba(7, 11, 13, 0.56) 0%,
          rgba(7, 11, 13, 0.28) 55%,
          transparent 88%
        ),
        linear-gradient(
          180deg,
          rgba(7, 11, 13, 0.16) 0%,
          transparent 24%,
          transparent 76%,
          rgba(7, 11, 13, 0.42) 100%
        );
    }

    /* Spacious, Centred Brand Arrangement */
    .cinema-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    /* 1. The Existing RG Logo Compass — Pure Transparent Cutout with 3D Relief */
    .compass-emblem-stage {
      position: relative;
      width: clamp(204px, 23vw, 260px);
      height: clamp(204px, 23vw, 260px);
      margin-bottom: clamp(14px, 2.2vh, 22px);
      perspective: 900px;
      user-select: none;
    }

    .compass-medallion-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      animation: compassFloat 7.5s ease-in-out infinite alternate;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.48));
    }

    @keyframes compassFloat {
      0% {
        transform: translate3d(0, 2px, 0) rotateX(2.2deg) rotateY(-2.4deg);
      }
      100% {
        transform: translate3d(0, -4px, 0) rotateX(-2.2deg) rotateY(2.4deg);
      }
    }

    /* Transparent Cutout 3D Base Layer (Follows Artwork Silhouette Only) */
    .compass-base-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transform: translateZ(0px);
      pointer-events: none;
    }

    /* Raised Front-Face Original RG Compass Artwork Layer (Parallax Relief) */
    .compass-relief-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transform: translateZ(4px);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    /* Precision Bearing Calibration Ring (Reveals Only During Entry Transition) */
    .compass-transition-ring {
      position: absolute;
      inset: -24%;
      width: 148%;
      height: 148%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.84) rotate(-42deg);
      transition:
        opacity 0.2s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Preloaded Live Homepage Portal — clipped to the compass's own inner ring
       (radius and homepage depth are driven per-frame from JS during entry) */
    .home-portal-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      clip-path: circle(0px at 50% 50%);
      background: #0d1214;
      overflow: hidden;
    }

    .home-portal-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d1214;
      transform: scale(0.8);
      will-change: transform;
    }

    /* Entry Transition Choreography: Bearing Lock → Fly Through the Compass
       1. Text clears; compass leans back, then snaps upright as the bearing ring locks.
       2. The homepage appears inside the compass's own ring, seen through the
          transparent gaps around the tripod and buildings.
       3. Camera pushes through the compass (scale driven from JS so the portal
          stays locked under the ring) until the homepage fills the screen. */
    .welcome-heading,
    .welcome-tagline,
    .enter-site-btn {
      transition:
        opacity 0.2s ease,
        transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.is-entering .welcome-heading,
    body.is-entering .welcome-tagline,
    body.is-entering .enter-site-btn {
      opacity: 0;
      transform: translateY(14px) scale(0.97);
      pointer-events: none;
    }

    body.is-entering .welcome-tagline { transition-delay: 0.03s; }
    body.is-entering .enter-site-btn { transition-delay: 0.06s; }

    body.is-entering .cinema-backdrop {
      opacity: 0.15;
      transition: opacity 0.3s ease;
    }

    body.is-entering .compass-transition-ring {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      transition:
        opacity 0.16s ease,
        transform 0.34s cubic-bezier(0.2, 1.2, 0.35, 1);
    }

    body.is-entering .compass-emblem-stage {
      will-change: transform, opacity;
    }

    body.is-entering .compass-medallion-3d {
      animation: compassBearingLock 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    body.is-entering .compass-relief-img {
      transform: translateZ(18px);
    }

    /* Drop the soft shadow while flying through — keeps the zoomed layer cheap and clean */
    body.is-pushing .compass-medallion-3d {
      filter: none;
    }

    body.is-entering .cinema-center {
      z-index: 40;
    }

    @keyframes compassBearingLock {
      0% {
        transform: scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }
      42% {
        transform: scale(0.92) rotateX(14deg) rotateY(-9deg) rotateZ(-12deg);
      }
      78% {
        transform: scale(1.03) rotateX(-2deg) rotateY(1deg) rotateZ(1.5deg);
      }
      100% {
        transform: scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }
    }

    /* 2. Company Name Beneath the Compass */
    .welcome-heading {
      font-size: clamp(1.95rem, 3.8vw, 3.1rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--paper);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.78), 0 1px 4px rgba(0, 0, 0, 0.65);
      margin-bottom: clamp(10px, 1.6vh, 14px);
    }

    .welcome-heading span {
      display: block;
      color: var(--gold);
    }

    /* 3. Tagline */
    .welcome-tagline {
      font-size: clamp(1rem, 1.35vw, 1.18rem);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--muted);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      margin-bottom: clamp(26px, 4vh, 38px);
      max-width: 36ch;
    }

    /* 4. Single Clear "Enter site →" Button */
    .enter-site-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #f8d63a 0%, var(--gold) 55%, var(--gold-warm) 100%);
      color: #070b0d;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(0.96rem, 1.1vw, 1.05rem);
      letter-spacing: 0.02em;
      padding: 15px 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.52),
        0 4px 14px rgba(245, 207, 37, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition:
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-site-btn:hover {
      background: linear-gradient(180deg, #ffe04d 0%, #f7d32e 55%, #ecc01a 100%);
      transform: translateY(-2px);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.58),
        0 6px 20px rgba(245, 207, 37, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .enter-site-btn:active {
      transform: translateY(0);
    }

    .enter-site-btn:focus {
      outline: none;
    }

    .enter-site-btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
      box-shadow:
        0 0 0 5px rgba(245, 207, 37, 0.5),
        0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .enter-arrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 500;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .enter-site-btn:hover .enter-arrow,
    .enter-site-btn:focus-visible .enter-arrow {
      transform: translateX(3px);
    }

    /* Responsive Scaling for Tablets and Phones — Portrait / Mobile framing uses dedicated 9:16 river survey composition */
    @media (max-width: 768px), (orientation: portrait) and (max-width: 1024px) {
      .cinema-welcome {
        padding: 24px 20px;
      }

      .cinema-media {
        object-position: 92% 50%;
      }

      .cinema-backdrop {
        background:
          radial-gradient(
            ellipse 82% 34% at 50% 60%,
            rgba(7, 11, 13, 0.56) 0%,
            rgba(7, 11, 13, 0.28) 56%,
            transparent 88%
          ),
          linear-gradient(
            180deg,
            rgba(7, 11, 13, 0.16) 0%,
            transparent 24%,
            transparent 74%,
            rgba(7, 11, 13, 0.42) 100%
          );
      }

      .cinema-center {
        padding-bottom: clamp(22px, 5vh, 48px);
      }

      .compass-emblem-stage {
        width: clamp(164px, 43vw, 196px);
        height: clamp(164px, 43vw, 196px);
        margin-bottom: 14px;
      }

      .welcome-heading {
        font-size: clamp(1.65rem, 6.7vw, 2.2rem);
        margin-bottom: 8px;
      }

      .welcome-tagline {
        font-size: clamp(0.84rem, 3.6vw, 0.96rem);
        margin-bottom: 24px;
        max-width: none;
      }

      .enter-site-btn {
        padding: 14px 30px;
        min-width: 196px;
      }
    }

    @media (max-height: 620px) {
      .compass-emblem-stage {
        width: 136px;
        height: 136px;
        margin-bottom: 12px;
      }
      .welcome-heading {
        font-size: 1.65rem;
        margin-bottom: 6px;
      }
      .welcome-tagline {
        margin-bottom: 18px;
      }
    }

    /* Respect Reduced-Motion Preferences */
    @media (prefers-reduced-motion: reduce) {
      .cinema-stage,
      .compass-medallion-3d {
        animation: none !important;
        transform: none !important;
      }

      .compass-transition-ring {
        display: none !important;
      }

      body {
        transition: opacity 0.2s ease;
      }

      .enter-site-btn,
      .enter-arrow {
        transition: none;
      }
    }
  </style>
</head>
<body>

<main class="cinema-welcome" aria-labelledby="welcome-heading">
  <!-- Looping Responsive Video Background (4K Landscape Desktop / 9:16 Portrait Mobile) -->
  <div class="cinema-stage" id="cinemaStage" aria-hidden="true">
    <video
      class="cinema-media"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      data-desktop-src="assets/video/cumbria-river-survey-4k.mp4"
      data-desktop-poster="assets/video/cumbria-river-survey-4k-poster.jpg"
      data-mobile-src="assets/video/cumbria-river-survey-mobile.mp4"
      data-mobile-poster="assets/video/cumbria-river-survey-mobile-poster.jpg"
      id="bgVideo"
    >
      <img
        class="cinema-media"
        src="assets/video/cumbria-river-survey-4k-poster.jpg"
        alt=""
      />
    </video>
    <script>
      (function () {
        var v = document.getElementById("bgVideo");
        if (!v || !window.matchMedia) return;
        var mq = window.matchMedia("(max-width: 768px), ((orientation: portrait) and (max-width: 1024px))");
        function syncVideoSource(shouldPlay) {
          var isMob = mq.matches;
          var nextSrc = isMob ? v.dataset.mobileSrc : v.dataset.desktopSrc;
          var nextPoster = isMob ? v.dataset.mobilePoster : v.dataset.desktopPoster;
          if (nextPoster && v.getAttribute("poster") !== nextPoster) {
            v.setAttribute("poster", nextPoster);
          }
          if (nextSrc && v.getAttribute("src") !== nextSrc) {
            v.setAttribute("src", nextSrc);
            v.load();
            if (shouldPlay && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
              v.play().catch(function () {});
            }
          }
        }
        syncVideoSource(false);
        if (mq.addEventListener) {
          mq.addEventListener("change", function () { syncVideoSource(true); });
        }
      })();
    </script>
  </div>

  <!-- Subtle Dark Gradient Behind Central Composition -->
  <div class="cinema-backdrop" aria-hidden="true"></div>

  <!-- Live Homepage Portal: revealed inside the compass ring during entry (src set lazily once idle) -->
  <div class="home-portal-wrap" id="homePortal" aria-hidden="true">
    <iframe class="home-portal-frame" id="homePortalFrame" data-src="index.html" tabindex="-1" title="RG Civil Engineering and Surveying Homepage"></iframe>
  </div>

  <!-- Central Focal Composition -->
  <div class="cinema-center">
    <!-- 1. The Existing RG Logo Compass — Pure Transparent Cutout with 3D Depth -->
    <div class="compass-emblem-stage" id="compassStage">
      <!-- Precision Bearing Calibration Ring (Only visible during Enter transition) -->
      <svg class="compass-transition-ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle cx="120" cy="120" r="108" fill="none" stroke="rgba(245, 207, 37, 0.42)" stroke-width="1" stroke-dasharray="4 6" />
        <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(245, 207, 37, 0.22)" stroke-width="0.75" />
        <line x1="120" y1="2" x2="120" y2="14" stroke="#f5cf25" stroke-width="1.5" />
        <line x1="120" y1="226" x2="120" y2="238" stroke="#f5cf25" stroke-width="1.5" />
        <line x1="2" y1="120" x2="14" y2="120" stroke="#f5cf25" stroke-width="1.5" />
        <line x1="226" y1="120" x2="238" y2="120" stroke="#f5cf25" stroke-width="1.5" />
      </svg>

      <div class="compass-medallion-3d" id="compassMedallion">
        <img
          class="compass-base-img"
          src="assets/brand/rg-logo-compass-cutout-3d.png"
          alt="RG Civil Engineering and Surveying compass logo"
          width="400"
          height="400"
          decoding="async"
        />
        <img
          class="compass-relief-img"
          src="assets/brand/rg-logo-compass-cutout-front.png"
          alt=""
          aria-hidden="true"
          width="400"
          height="400"
          decoding="async"
        />
      </div>
    </div>

    <!-- 2. Company Name -->
    <h1 class="welcome-heading" id="welcome-heading">
      RG Civil Engineering
      <span>&amp; Surveying</span>
    </h1>

    <!-- 3. Tagline -->
    <p class="welcome-tagline">
      Measured on site. Built with confidence.
    </p>

    <!-- 4. Entry Button -->
    <a href="index.html" class="enter-site-btn" id="enterSiteBtn">
      <span>Enter site</span>
      <span class="enter-arrow" aria-hidden="true">→</span>
    </a>
  </div>
</main>

<script>
  (function () {
    const enterBtn = document.getElementById('enterSiteBtn');
    const video = document.getElementById('bgVideo');
    const medallion = document.getElementById('compassMedallion');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let isEntering = false;

    // Respect reduced-motion preferences for background video
    function syncReducedMotion() {
      if (!video) return;
      if (reducedMotion.matches) {
        video.pause();
      } else {
        video.play().catch(function () {});
      }
    }
    syncReducedMotion();
    if (reducedMotion.addEventListener) {
      reducedMotion.addEventListener('change', syncReducedMotion);
    }

    // Subtle, restrained 3D tilt on fine pointer movement (no spinning)
    if (medallion && !reducedMotion.matches && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      window.addEventListener('pointermove', function (e) {
        if (isEntering) return;
        const nx = (e.clientX / window.innerWidth - 0.5) * 2;
        const ny = (e.clientY / window.innerHeight - 0.5) * 2;
        const rotY = (nx * 3.2).toFixed(2);
        const rotX = (-ny * 3.2).toFixed(2);
        medallion.style.animation = 'none';
        medallion.style.transform = 'translate3d(0, -1px, 0) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
      }, { passive: true });

      window.addEventListener('pointerleave', function () {
        if (isEntering) return;
        medallion.style.transform = '';
        medallion.style.animation = '';
      });
    }

    // ---- Live homepage portal -------------------------------------------------
    const compassStage = document.getElementById('compassStage');
    const bearingRing = compassStage ? compassStage.querySelector('.compass-transition-ring') : null;
    const scene = document.getElementById('cinemaStage');
    const portal = document.getElementById('homePortal');
    const portalFrame = document.getElementById('homePortalFrame');

    // Hold the homepage's first slide still inside the portal so the hand-off to the real page
    // matches; the hero copy is shown during the flight, then eases out as we land so the
    // real page's own headline entrance plays on as one continuous move.
    const PORTAL_FREEZE_CSS =
      '.hero-enter{animation:none!important;opacity:1;transform:none;transition:opacity .14s ease,transform .14s ease}' +
      'html.rg-portal-landing .hero-enter{opacity:0!important;transform:translateY(14px)!important}' +
      '.hero-slide{opacity:0!important;transition:none!important}' +
      '.hero-slide[data-hero-slide="0"]{opacity:1!important}' +
      '.hero-slide[data-hero-slide="0"] img{transform:scale(1)!important;transition:none!important}' +
      'html{scrollbar-width:none}';

    function freezePortalDoc() {
      try {
        const doc = portalFrame.contentDocument;
        if (!doc || !doc.head || doc.getElementById('rg-portal-freeze')) return;
        const style = doc.createElement('style');
        style.id = 'rg-portal-freeze';
        style.textContent = PORTAL_FREEZE_CSS;
        doc.head.appendChild(style);
      } catch (err) { /* cross-origin or not ready — portal still works unfrozen */ }
    }

    function loadPortal() {
      if (!portalFrame || portalFrame.getAttribute('src')) return;
      portalFrame.addEventListener('load', freezePortalDoc);
      portalFrame.setAttribute('src', portalFrame.dataset.src || 'index.html');
    }

    // Load once the welcome scene has settled (keeps first paint and the video fast),
    // or immediately if the visitor heads for the button.
    if (!reducedMotion.matches && portalFrame) {
      const idleLoad = function () {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadPortal, { timeout: 1500 });
        } else {
          setTimeout(loadPortal, 600);
        }
      };
      if (document.readyState === 'complete') idleLoad();
      else window.addEventListener('load', idleLoad);
      if (enterBtn) {
        enterBtn.addEventListener('pointerenter', loadPortal, { once: true });
        enterBtn.addEventListener('focus', loadPortal, { once: true });
        enterBtn.addEventListener('touchstart', loadPortal, { once: true, passive: true });
      }
    }

    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function smooth(t) { return t * t * (3 - 2 * t); }

    // Bearing Lock → fly through the compass into the live homepage
    function enterSite(e) {
      if (e) {
        // Allow modifier clicks (e.g. Cmd/Ctrl+click to open in new tab) to work normally
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (e.button && e.button !== 0)) {
          return;
        }
        e.preventDefault();
      }
      if (isEntering) return;
      isEntering = true;

      const targetUrl = (enterBtn && enterBtn.getAttribute('href')) || 'index.html';

      if (reducedMotion.matches || !compassStage || !portal || !portalFrame) {
        document.body.classList.add('is-leaving');
        setTimeout(function () {
          window.location.href = targetUrl;
        }, 160);
        return;
      }

      if (medallion) {
        medallion.style.transform = '';
        medallion.style.animation = '';
      }

      const LOCK_MS = 340;  // lean back, snap upright, bearing ring locks
      const OPEN_MS = 220;  // homepage lights up inside the compass ring
      const PUSH_MS = 860;  // camera flies through the compass

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const sr = compassStage.getBoundingClientRect();
      const cx = sr.left + sr.width / 2;
      const cy = sr.top + sr.height / 2;
      // Portal edge sits under the opaque silver/gold ring band of the artwork (≈0.23–0.26 of width)
      const r0 = sr.width * 0.24;
      // Zoom through the clearest gap in the artwork (the sky between the total station and
      // the buildings) so the emblem parts around the camera instead of smearing across it
      const GAP_X = 0.541;
      const GAP_Y = 0.39;
      const fx = sr.left + sr.width * GAP_X;
      const fy = sr.top + sr.height * GAP_Y;

      // Smallest zoom at which the ring-clipped portal covers every corner of the viewport
      function coversAll(s) {
        const pcx = fx + s * (cx - fx);
        const pcy = fy + s * (cy - fy);
        const R = r0 * s;
        return [[0, 0], [vw, 0], [0, vh], [vw, vh]].every(function (c) {
          return Math.hypot(c[0] - pcx, c[1] - pcy) <= R;
        });
      }
      let lo = 1;
      let hi = 2;
      while (!coversAll(hi) && hi < 2000) hi *= 2;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (coversAll(mid)) hi = mid; else lo = mid;
      }
      // Keep flying until every part of the artwork has passed the edges of the screen
      // (nearest artwork to the gap ≈ 0.069 of the emblem width), rather than dissolving it mid-frame
      const GAP_CLEAR = 0.069;
      const reachF = Math.hypot(Math.max(fx, vw - fx), Math.max(fy, vh - fy));
      const sClear = Math.max(hi * 1.05, (reachF / (sr.width * GAP_CLEAR)) * 1.04);
      const logMax = Math.log(sClear);
      const pCovered = Math.pow(Math.log(hi * 1.02) / logMax, 1 / 1.75); // push progress when portal fills screen

      // Frame a strong part of the homepage (the hero photo) behind the compass at first,
      // drifting to the page's true position as we arrive.
      const K0 = 0.8;
      let fdx = 0;
      let fdy = 0;
      loadPortal();
      freezePortalDoc();
      try {
        const hv = portalFrame.contentDocument && portalFrame.contentDocument.querySelector('.hero-visual');
        if (hv) {
          const hr = hv.getBoundingClientRect();
          const hx = hr.left + hr.width * 0.5;
          const hy = hr.top + Math.min(hr.height, vh) * 0.4;
          fdx = Math.max(-vw * 0.6, Math.min(vw * 0.6, -K0 * (hx - fx)));
          fdy = Math.max(-vh * 0.6, Math.min(vh * 0.6, -K0 * (hy - fy)));
        }
      } catch (err) { /* keep centred */ }

      // Freeze the background's current breathing position so the push starts without a jump
      let sceneBase = '';
      if (scene) {
        const ct = window.getComputedStyle(scene).transform;
        sceneBase = ct && ct !== 'none' ? ct : '';
        scene.style.animation = 'none';
        scene.style.transform = sceneBase;
      }

      portalFrame.style.transformOrigin = fx.toFixed(1) + 'px ' + fy.toFixed(1) + 'px';
      compassStage.style.transformOrigin = (GAP_X * 100) + '% ' + (GAP_Y * 100) + '%';
      document.body.classList.add('is-entering');

      const t0 = performance.now();
      let pushing = false;
      let landing = false;
      let navigated = false;

      function go() {
        if (navigated) return;
        navigated = true;
        window.location.replace(targetUrl);
      }

      function frame(now) {
        const t = now - t0;
        const open = easeOutCubic(clamp01((t - (LOCK_MS - 120)) / OPEN_MS));
        const p = clamp01((t - LOCK_MS) / PUSH_MS);
        const ease = Math.pow(p, 1.75);           // gentle approach, then a rush through
        const s = Math.exp(logMax * ease);        // exponential zoom = constant perceived speed growth
        const q = clamp01(p / pCovered);          // homepage settles exactly as it fills the screen
        const drift = 1 - smooth(clamp01((q - 0.3) / 0.7));
        const exit = smooth(clamp01((p - pCovered) / (1 - pCovered)));

        if (p > 0 && !pushing) {
          pushing = true;
          document.body.classList.add('is-pushing');
        }
        if (!landing && p >= pCovered - 0.06) {
          landing = true;
          try { portalFrame.contentDocument.documentElement.classList.add('rg-portal-landing'); } catch (err) {}
        }

        compassStage.style.transform = 'scale(' + s.toFixed(4) + ')';
        compassStage.style.opacity = (1 - exit).toFixed(3);
        if (bearingRing && p > 0) {
          bearingRing.style.transition = 'none';
          bearingRing.style.opacity = (1 - smooth(clamp01((p - 0.3) / 0.4))).toFixed(3);
        }

        portal.style.clipPath = 'circle(' + (r0 * s * open).toFixed(1) + 'px at ' +
          (fx + s * (cx - fx)).toFixed(1) + 'px ' + (fy + s * (cy - fy)).toFixed(1) + 'px)';
        portalFrame.style.transform =
          'translate(' + (fdx * drift).toFixed(1) + 'px, ' + (fdy * drift).toFixed(1) + 'px) ' +
          'scale(' + (K0 + (1 - K0) * smooth(q)).toFixed(4) + ')';

        if (scene) {
          scene.style.transform = sceneBase + ' scale(' + (1 + 0.3 * ease).toFixed(4) + ')';
        }

        if (p < 1) {
          requestAnimationFrame(frame);
        } else {
          setTimeout(go, 40);
        }
      }
      requestAnimationFrame(frame);

      // Safety net if animation frames are throttled (e.g. background tab)
      setTimeout(go, LOCK_MS + PUSH_MS + 600);
    }

    if (enterBtn) {
      enterBtn.addEventListener('click', enterSite);
      enterBtn.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          enterSite();
        }
      });
    }
  })();
</script>

</body>
</html>
