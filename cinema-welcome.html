<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070b0d" />
  <title>RG Civil Engineering &amp; Surveying</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #070b0d;
      --graphite: #1c2024;
      -- graphite-edge: #2c3137;
      --paper: #f4f6f8;
      --gold: #f5cf25;
      --gold-warm: #e5b916;
      --muted: rgba(244, 246, 248, 0.88);
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    /* Full-Viewport Welcome Container */
    .cinema-welcome {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vh, 56px) clamp(20px, 5vw, 64px);
      overflow: hidden;
      isolation: isolate;
    }

    /* Cinematic Landscape Background */
    .cinema-stage {
      position: absolute;
      inset: -2.5%;
      width: 105%;
      height: 105%;
      z-index: -2;
      pointer-events: none;
      will-change: transform;
      animation: stageBreathe 20s ease-in-out infinite alternate;
    }

    @keyframes stageBreathe {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.028) translate3d(-0.5%, -0.6%, 0); }
    }

    .cinema-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 54%;
      filter: contrast(1.03) saturate(1.02) brightness(0.94);
    }

    /* Subtle Dark Gradient Behind Central Composition (Scenery & Tripod Remain Visible) */
    .cinema-backdrop {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 54% 50% at 50% 50%,
          rgba(7, 11, 13, 0.64) 0%,
          rgba(7, 11, 13, 0.42) 45%,
          rgba(7, 11, 13, 0.14) 72%,
          transparent 90%
        ),
        radial-gradient(
          ellipse 96% 92% at 50% 50%,
          transparent 56%,
          rgba(7, 11, 13, 0.48) 100%
        ),
        linear-gradient(
          180deg,
          rgba(7, 11, 13, 0.32) 0%,
          transparent 24%,
          transparent 76%,
          rgba(7, 11, 13, 0.48) 100%
        );
    }

    /* Spacious, Centred Brand Arrangement */
    .cinema-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    /* 1. The Existing RG Logo Compass in Refined 3D */
    .compass-emblem-stage {
      position: relative;
      width: clamp(134px, 15.5vw, 172px);
      height: clamp(134px, 15.5vw, 172px);
      margin-bottom: clamp(22px, 3.2vh, 32px);
      perspective: 850px;
      user-select: none;
    }

    .compass-medallion-3d {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-style: preserve-3d;
      will-change: transform;
      animation: compassFloat 7.5s ease-in-out infinite alternate;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      filter:
        drop-shadow(0 20px 36px rgba(0, 0, 0, 0.68))
        drop-shadow(0 5px 12px rgba(0, 0, 0, 0.5));
    }

    @keyframes compassFloat {
      0% {
        transform: translate3d(0, 2px, 0) rotateX(2deg) rotateY(-2.2deg);
      }
      100% {
        transform: translate3d(0, -4px, 0) rotateX(-2.2deg) rotateY(2.2deg);
      }
    }

    /* Subtle Machined Brushed-Graphite Outer Bezel Depth Ring */
    .compass-bezel-back {
      position: absolute;
      inset: 0.8%;
      border-radius: 50%;
      background: linear-gradient(135deg, #343940 0%, #171a1d 52%, #0b0d0f 100%);
      box-shadow:
        inset 0 1px 1.5px rgba(255, 255, 255, 0.2),
        0 3px 8px rgba(0, 0, 0, 0.65);
      transform: translateZ(-4px);
      pointer-events: none;
    }

    /* Brushed Graphite Disc Base with Original Artwork Fallback */
    .compass-base-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: contain;
      transform: translateZ(0px);
      pointer-events: none;
    }

    /* Raised Front-Face Original RG Compass Artwork Layer (Parallax Relief) */
    .compass-relief-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: contain;
      transform: translateZ(5px);
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.42));
    }

    /* Soft Directional Specular Sheen Across the Medallion */
    .compass-directional-light {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle at var(--light-x, 30%) var(--light-y, 24%),
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.03) 38%,
        transparent 68%
      );
      transform: translateZ(6px);
      pointer-events: none;
    }

    /* 2. Company Name Beneath the Compass */
    .welcome-heading {
      font-size: clamp(1.95rem, 3.8vw, 3.1rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--paper);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.78), 0 1px 4px rgba(0, 0, 0, 0.65);
      margin-bottom: clamp(10px, 1.6vh, 14px);
    }

    .welcome-heading span {
      display: block;
      color: var(--gold);
    }

    /* 3. Tagline */
    .welcome-tagline {
      font-size: clamp(1rem, 1.35vw, 1.18rem);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--muted);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      margin-bottom: clamp(26px, 4vh, 38px);
      max-width: 36ch;
    }

    /* 4. Single Clear "Enter site →" Button */
    .enter-site-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #f8d63a 0%, var(--gold) 55%, var(--gold-warm) 100%);
      color: #070b0d;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(0.96rem, 1.1vw, 1.05rem);
      letter-spacing: 0.02em;
      padding: 15px 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.52),
        0 4px 14px rgba(245, 207, 37, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition:
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-site-btn:hover {
      background: linear-gradient(180deg, #ffe04d 0%, #f7d32e 55%, #ecc01a 100%);
      transform: translateY(-2px);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.58),
        0 6px 20px rgba(245, 207, 37, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .enter-site-btn:active {
      transform: translateY(0);
    }

    .enter-site-btn:focus {
      outline: none;
    }

    .enter-site-btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
      box-shadow:
        0 0 0 5px rgba(245, 207, 37, 0.5),
        0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .enter-arrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 500;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .enter-site-btn:hover .enter-arrow,
    .enter-site-btn:focus-visible .enter-arrow {
      transform: translateX(3px);
    }

    /* Responsive Scaling for Tablets and Phones */
    @media (max-width: 768px) {
      .cinema-welcome {
        padding: 24px 20px;
      }

      .cinema-media {
        object-position: 76% 52%;
      }

      .cinema-backdrop {
        background:
          radial-gradient(
            ellipse 86% 56% at 50% 50%,
            rgba(7, 11, 13, 0.68) 0%,
            rgba(7, 11, 13, 0.44) 52%,
            rgba(7, 11, 13, 0.16) 82%,
            transparent 100%
          ),
          linear-gradient(
            180deg,
            rgba(7, 11, 13, 0.36) 0%,
            transparent 24%,
            transparent 76%,
            rgba(7, 11, 13, 0.52) 100%
          );
      }

      .compass-emblem-stage {
        width: clamp(114px, 27vw, 138px);
        height: clamp(114px, 27vw, 138px);
        margin-bottom: 18px;
      }

      .welcome-heading {
        font-size: clamp(1.68rem, 6.8vw, 2.2rem);
        margin-bottom: 8px;
      }

      .welcome-tagline {
        font-size: clamp(0.94rem, 3.8vw, 1.05rem);
        margin-bottom: 24px;
      }

      .enter-site-btn {
        padding: 14px 30px;
        min-width: 196px;
      }
    }

    @media (max-height: 620px) {
      .compass-emblem-stage {
        width: 104px;
        height: 104px;
        margin-bottom: 14px;
      }
      .welcome-heading {
        font-size: 1.65rem;
        margin-bottom: 6px;
      }
      .welcome-tagline {
        margin-bottom: 18px;
      }
    }

    /* Respect Reduced-Motion Preferences */
    @media (prefers-reduced-motion: reduce) {
      .cinema-stage,
      .compass-medallion-3d {
        animation: none !important;
        transform: none !important;
      }

      body {
        transition: opacity 0.2s ease;
      }

      .enter-site-btn,
      .enter-arrow {
        transition: none;
      }
    }
  </style>
</head>
<body>

<main class="cinema-welcome" aria-labelledby="welcome-heading">
  <!-- Looping Landscape Video Background with Poster & Image Fallback -->
  <div class="cinema-stage" aria-hidden="true">
    <video
      class="cinema-media"
      autoplay
      muted
      loop
      playsinline
      poster="assets/video/cumbria-river-survey-4k-poster.jpg"
      id="bgVideo"
    >
      <source src="assets/video/cumbria-river-survey-4k.mp4" type="video/mp4" />
      <img
        class="cinema-media"
        src="assets/video/cumbria-river-survey-4k-poster.jpg"
        alt=""
      />
    </video>
  </div>

  <!-- Subtle Dark Gradient Behind Central Composition -->
  <div class="cinema-backdrop" aria-hidden="true"></div>

  <!-- Central Focal Composition -->
  <div class="cinema-center">
    <!-- 1. The Existing RG Logo Compass in Refined 3D -->
    <div class="compass-emblem-stage">
      <div class="compass-medallion-3d" id="compassMedallion">
        <div class="compass-bezel-back" aria-hidden="true"></div>
        <img
          class="compass-base-img"
          src="assets/brand/rg-logo-compass-3d.png"
          alt="RG Civil Engineering and Surveying compass logo"
          width="384"
          height="384"
          decoding="async"
        />
        <img
          class="compass-relief-img"
          src="assets/brand/rg-logo-emblem-layer.png"
          alt=""
          aria-hidden="true"
          width="384"
          height="384"
          decoding="async"
        />
        <div class="compass-directional-light" aria-hidden="true"></div>
      </div>
    </div>

    <!-- 2. Company Name -->
    <h1 class="welcome-heading" id="welcome-heading">
      RG Civil Engineering
      <span>&amp; Surveying</span>
    </h1>

    <!-- 3. Tagline -->
    <p class="welcome-tagline">
      Measured on site. Built with confidence.
    </p>

    <!-- 4. Entry Button -->
    <a href="index.html" class="enter-site-btn" id="enterSiteBtn">
      <span>Enter site</span>
      <span class="enter-arrow" aria-hidden="true">→</span>
    </a>
  </div>
</main>

<script>
  (function () {
    const enterBtn = document.getElementById('enterSiteBtn');
    const video = document.getElementById('bgVideo');
    const medallion = document.getElementById('compassMedallion');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let isEntering = false;

    // Respect reduced-motion preferences for background video
    function syncReducedMotion() {
      if (!video) return;
      if (reducedMotion.matches) {
        video.pause();
      } else {
        video.play().catch(function () {});
      }
    }
    syncReducedMotion();
    if (reducedMotion.addEventListener) {
      reducedMotion.addEventListener('change', syncReducedMotion);
    }

    // Subtle, restrained 3D tilt on fine pointer movement (no spinning)
    if (medallion && !reducedMotion.matches && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      window.addEventListener('pointermove', function (e) {
        const nx = (e.clientX / window.innerWidth - 0.5) * 2;
        const ny = (e.clientY / window.innerHeight - 0.5) * 2;
        const rotY = (nx * 3.2).toFixed(2);
        const rotX = (-ny * 3.2).toFixed(2);
        medallion.style.animation = 'none';
        medallion.style.transform = 'translate3d(0, -1px, 0) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
        medallion.style.setProperty('--light-x', (30 - nx * 10).toFixed(1) + '%');
        medallion.style.setProperty('--light-y', (24 - ny * 10).toFixed(1) + '%');
      }, { passive: true });

      window.addEventListener('pointerleave', function () {
        medallion.style.transform = '';
        medallion.style.animation = '';
      });
    }

    // Smooth fade into main homepage when visitor selects "Enter site"
    function enterSite(e) {
      if (e) {
        // Allow modifier clicks (e.g. Cmd/Ctrl+click to open in new tab) to work normally
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (e.button && e.button !== 0)) {
          return;
        }
        e.preventDefault();
      }
      if (isEntering) return;
      isEntering = true;
      document.body.classList.add('is-leaving');
      const delay = reducedMotion.matches ? 150 : 420;
      setTimeout(function () {
        window.location.href = enterBtn.getAttribute('href') || 'index.html';
      }, delay);
    }

    if (enterBtn) {
      enterBtn.addEventListener('click', enterSite);
      enterBtn.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          enterSite();
        }
      });
    }
  })();
</script>

</body>
</html>
