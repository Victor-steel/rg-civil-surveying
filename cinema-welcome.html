<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070b0d" />
  <title>RG Civil Engineering &amp; Surveying</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #070b0d;
      --graphite: #1c2024;
      -- graphite-edge: #2c3137;
      --paper: #f4f6f8;
      --gold: #f5cf25;
      --gold-warm: #e5b916;
      --muted: rgba(244, 246, 248, 0.88);
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    /* Full-Viewport Welcome Container */
    .cinema-welcome {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vh, 56px) clamp(20px, 5vw, 64px);
      overflow: hidden;
      isolation: isolate;
    }

    /* Cinematic Landscape Background */
    .cinema-stage {
      position: absolute;
      inset: -2.5%;
      width: 105%;
      height: 105%;
      z-index: -2;
      pointer-events: none;
      will-change: transform;
      animation: stageBreathe 20s ease-in-out infinite alternate;
    }

    @keyframes stageBreathe {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.028) translate3d(-0.5%, -0.6%, 0); }
    }

    .cinema-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 46% 58%;
      filter: contrast(1.03) saturate(1.03) brightness(0.98);
    }

    /* Subtle Dark Gradient Behind Text Only — Keeps Compass Interior 100% Clear & Bright */
    .cinema-backdrop {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 48% 32% at 50% 66%,
          rgba(7, 11, 13, 0.56) 0%,
          rgba(7, 11, 13, 0.28) 55%,
          transparent 88%
        ),
        linear-gradient(
          180deg,
          rgba(7, 11, 13, 0.16) 0%,
          transparent 24%,
          transparent 76%,
          rgba(7, 11, 13, 0.42) 100%
        );
    }

    /* Spacious, Centred Brand Arrangement */
    .cinema-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    /* 1. The Existing RG Logo Compass — Pure Transparent Cutout with 3D Relief */
    .compass-emblem-stage {
      position: relative;
      width: clamp(204px, 23vw, 260px);
      height: clamp(204px, 23vw, 260px);
      margin-bottom: clamp(14px, 2.2vh, 22px);
      perspective: 900px;
      user-select: none;
    }

    .compass-medallion-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      animation: compassFloat 7.5s ease-in-out infinite alternate;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.48));
    }

    @keyframes compassFloat {
      0% {
        transform: translate3d(0, 2px, 0) rotateX(2.2deg) rotateY(-2.4deg);
      }
      100% {
        transform: translate3d(0, -4px, 0) rotateX(-2.2deg) rotateY(2.4deg);
      }
    }

    /* Transparent Cutout 3D Base Layer (Follows Artwork Silhouette Only) */
    .compass-base-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transform: translateZ(0px);
      pointer-events: none;
    }

    /* Raised Front-Face Original RG Compass Artwork Layer (Parallax Relief) */
    .compass-relief-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transform: translateZ(4px);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    /* Precision Bearing Calibration Ring (Reveals Only During Entry Transition) */
    .compass-transition-ring {
      position: absolute;
      inset: -24%;
      width: 148%;
      height: 148%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.84) rotate(-42deg);
      transition:
        opacity 0.2s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Preloaded Live Homepage Portal (Reveals Directly Through Compass Centre) */
    .home-portal-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      clip-path: circle(0px at var(--iris-x, 50%) var(--iris-y, 42%));
      transition: clip-path 0.72s cubic-bezier(0.65, 0, 0.25, 1);
      background: #0d1214;
    }

    .home-portal-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d1214;
    }

    /* Crisp Gold Optical Lens Ring on the Expanding Portal Edge */
    .iris-lens-ring {
      position: fixed;
      left: var(--iris-x, 50%);
      top: var(--iris-y, 42%);
      width: 0;
      height: 0;
      border-radius: 50%;
      border: 2.5px solid rgba(245, 207, 37, 0.92);
      box-shadow:
        0 0 28px rgba(245, 207, 37, 0.4),
        inset 0 0 24px rgba(245, 207, 37, 0.2);
      transform: translate(-50%, -50%);
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      transition:
        width 0.72s cubic-bezier(0.65, 0, 0.25, 1),
        height 0.72s cubic-bezier(0.65, 0, 0.25, 1),
        opacity 0.2s ease;
    }

    /* Entry Transition Choreography: Bearing Lock & Optical Iris Fly-Through */
    .welcome-heading,
    .welcome-tagline,
    .enter-site-btn {
      transition:
        opacity 0.22s ease,
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.is-entering .welcome-heading,
    body.is-entering .welcome-tagline,
    body.is-entering .enter-site-btn {
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      pointer-events: none;
    }

    body.is-entering .cinema-backdrop {
      opacity: 0.15;
      transition: opacity 0.3s ease;
    }

    body.is-entering .compass-transition-ring {
      opacity: 1;
      transform: scale(1.06) rotate(0deg);
    }

    body.is-entering .compass-medallion-3d {
      animation: compassPortalLaunch 0.96s cubic-bezier(0.45, 0, 0.15, 1) forwards !important;
    }

    body.is-entering .compass-relief-img {
      transform: translateZ(42px);
    }

    body.is-entering .cinema-stage {
      animation: stageLaunch 0.96s cubic-bezier(0.45, 0, 0.15, 1) forwards !important;
    }

    body.is-entering .cinema-center {
      z-index: 40;
    }

    body.is-iris-open .home-portal-wrap {
      clip-path: circle(150vmax at var(--iris-x, 50%) var(--iris-y, 42%));
    }

    body.is-iris-open .iris-lens-ring {
      width: 300vmax;
      height: 300vmax;
      opacity: 1;
    }

    @keyframes compassPortalLaunch {
      0% {
        transform: translate3d(0, 0, 0) scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        opacity: 1;
      }
      24% {
        transform: translate3d(0, 0, 0) scale(0.91) rotateX(12deg) rotateY(-10deg) rotateZ(-18deg);
        opacity: 1;
      }
      38% {
        transform: translate3d(0, 0, 20px) scale(1.04) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 0, 140px) scale(6.4) rotateX(0deg) rotateY(0deg) rotateZ(32deg);
        opacity: 0;
      }
    }

    @keyframes stageLaunch {
      0% {
        transform: scale(1) translate3d(0, 0, 0);
      }
      100% {
        transform: scale(1.16) translate3d(0, 0, 0);
      }
    }

    /* 2. Company Name Beneath the Compass */
    .welcome-heading {
      font-size: clamp(1.95rem, 3.8vw, 3.1rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--paper);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.78), 0 1px 4px rgba(0, 0, 0, 0.65);
      margin-bottom: clamp(10px, 1.6vh, 14px);
    }

    .welcome-heading span {
      display: block;
      color: var(--gold);
    }

    /* 3. Tagline */
    .welcome-tagline {
      font-size: clamp(1rem, 1.35vw, 1.18rem);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--muted);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      margin-bottom: clamp(26px, 4vh, 38px);
      max-width: 36ch;
    }

    /* 4. Single Clear "Enter site →" Button */
    .enter-site-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #f8d63a 0%, var(--gold) 55%, var(--gold-warm) 100%);
      color: #070b0d;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(0.96rem, 1.1vw, 1.05rem);
      letter-spacing: 0.02em;
      padding: 15px 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.52),
        0 4px 14px rgba(245, 207, 37, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition:
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-site-btn:hover {
      background: linear-gradient(180deg, #ffe04d 0%, #f7d32e 55%, #ecc01a 100%);
      transform: translateY(-2px);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.58),
        0 6px 20px rgba(245, 207, 37, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .enter-site-btn:active {
      transform: translateY(0);
    }

    .enter-site-btn:focus {
      outline: none;
    }

    .enter-site-btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
      box-shadow:
        0 0 0 5px rgba(245, 207, 37, 0.5),
        0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .enter-arrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 500;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .enter-site-btn:hover .enter-arrow,
    .enter-site-btn:focus-visible .enter-arrow {
      transform: translateX(3px);
    }

    /* Responsive Scaling for Tablets and Phones */
    @media (max-width: 768px) {
      .cinema-welcome {
        padding: 24px 20px;
      }

      .cinema-media {
        object-position: 62% 56%;
      }

      .cinema-backdrop {
        background:
          radial-gradient(
            ellipse 82% 34% at 50% 64%,
            rgba(7, 11, 13, 0.58) 0%,
            rgba(7, 11, 13, 0.30) 56%,
            transparent 90%
          ),
          linear-gradient(
            180deg,
            rgba(7, 11, 13, 0.18) 0%,
            transparent 24%,
            transparent 76%,
            rgba(7, 11, 13, 0.44) 100%
          );
      }

      .compass-emblem-stage {
        width: clamp(160px, 41vw, 196px);
        height: clamp(160px, 41vw, 196px);
        margin-bottom: 14px;
      }

      .welcome-heading {
        font-size: clamp(1.68rem, 6.8vw, 2.2rem);
        margin-bottom: 8px;
      }

      .welcome-tagline {
        font-size: clamp(0.94rem, 3.8vw, 1.05rem);
        margin-bottom: 24px;
      }

      .enter-site-btn {
        padding: 14px 30px;
        min-width: 196px;
      }
    }

    @media (max-height: 620px) {
      .compass-emblem-stage {
        width: 136px;
        height: 136px;
        margin-bottom: 12px;
      }
      .welcome-heading {
        font-size: 1.65rem;
        margin-bottom: 6px;
      }
      .welcome-tagline {
        margin-bottom: 18px;
      }
    }

    /* Respect Reduced-Motion Preferences */
    @media (prefers-reduced-motion: reduce) {
      .cinema-stage,
      .compass-medallion-3d {
        animation: none !important;
        transform: none !important;
      }

      .compass-transition-ring {
        display: none !important;
      }

      body {
        transition: opacity 0.2s ease;
      }

      .enter-site-btn,
      .enter-arrow {
        transition: none;
      }
    }
  </style>
</head>
<body>

<main class="cinema-welcome" aria-labelledby="welcome-heading">
  <!-- Looping Landscape Video Background with Poster & Image Fallback -->
  <div class="cinema-stage" aria-hidden="true">
    <video
      class="cinema-media"
      autoplay
      muted
      loop
      playsinline
      poster="assets/video/cumbria-river-survey-4k-poster.jpg"
      id="bgVideo"
    >
      <source src="assets/video/cumbria-river-survey-4k.mp4" type="video/mp4" />
      <img
        class="cinema-media"
        src="assets/video/cumbria-river-survey-4k-poster.jpg"
        alt=""
      />
    </video>
  </div>

  <!-- Subtle Dark Gradient Behind Central Composition -->
  <div class="cinema-backdrop" aria-hidden="true"></div>

  <!-- Preloaded Live Homepage Iris Portal (Behind Compass, Above Stage) -->
  <div class="home-portal-wrap" id="homePortal" aria-hidden="true">
    <iframe class="home-portal-frame" src="index.html" tabindex="-1" title="RG Civil Engineering and Surveying Homepage"></iframe>
  </div>
  <div class="iris-lens-ring" id="irisLensRing" aria-hidden="true"></div>

  <!-- Central Focal Composition -->
  <div class="cinema-center">
    <!-- 1. The Existing RG Logo Compass — Pure Transparent Cutout with 3D Depth -->
    <div class="compass-emblem-stage">
      <!-- Precision Bearing Calibration Ring (Only visible during Enter transition) -->
      <svg class="compass-transition-ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle cx="120" cy="120" r="108" fill="none" stroke="rgba(245, 207, 37, 0.42)" stroke-width="1" stroke-dasharray="4 6" />
        <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(245, 207, 37, 0.22)" stroke-width="0.75" />
        <line x1="120" y1="2" x2="120" y2="14" stroke="#f5cf25" stroke-width="1.5" />
        <line x1="120" y1="226" x2="120" y2="238" stroke="#f5cf25" stroke-width="1.5" />
        <line x1="2" y1="120" x2="14" y2="120" stroke="#f5cf25" stroke-width="1.5" />
        <line x1="226" y1="120" x2="238" y2="120" stroke="#f5cf25" stroke-width="1.5" />
      </svg>

      <div class="compass-medallion-3d" id="compassMedallion">
        <img
          class="compass-base-img"
          src="assets/brand/rg-logo-compass-cutout-3d.png"
          alt="RG Civil Engineering and Surveying compass logo"
          width="400"
          height="400"
          decoding="async"
        />
        <img
          class="compass-relief-img"
          src="assets/brand/rg-logo-compass-cutout-front.png"
          alt=""
          aria-hidden="true"
          width="400"
          height="400"
          decoding="async"
        />
      </div>
    </div>

    <!-- 2. Company Name -->
    <h1 class="welcome-heading" id="welcome-heading">
      RG Civil Engineering
      <span>&amp; Surveying</span>
    </h1>

    <!-- 3. Tagline -->
    <p class="welcome-tagline">
      Measured on site. Built with confidence.
    </p>

    <!-- 4. Entry Button -->
    <a href="index.html" class="enter-site-btn" id="enterSiteBtn">
      <span>Enter site</span>
      <span class="enter-arrow" aria-hidden="true">→</span>
    </a>
  </div>
</main>

<script>
  (function () {
    const enterBtn = document.getElementById('enterSiteBtn');
    const video = document.getElementById('bgVideo');
    const medallion = document.getElementById('compassMedallion');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let isEntering = false;

    // Respect reduced-motion preferences for background video
    function syncReducedMotion() {
      if (!video) return;
      if (reducedMotion.matches) {
        video.pause();
      } else {
        video.play().catch(function () {});
      }
    }
    syncReducedMotion();
    if (reducedMotion.addEventListener) {
      reducedMotion.addEventListener('change', syncReducedMotion);
    }

    // Subtle, restrained 3D tilt on fine pointer movement (no spinning)
    if (medallion && !reducedMotion.matches && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      window.addEventListener('pointermove', function (e) {
        if (isEntering) return;
        const nx = (e.clientX / window.innerWidth - 0.5) * 2;
        const ny = (e.clientY / window.innerHeight - 0.5) * 2;
        const rotY = (nx * 3.2).toFixed(2);
        const rotX = (-ny * 3.2).toFixed(2);
        medallion.style.animation = 'none';
        medallion.style.transform = 'translate3d(0, -1px, 0) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
      }, { passive: true });

      window.addEventListener('pointerleave', function () {
        if (isEntering) return;
        medallion.style.transform = '';
        medallion.style.animation = '';
      });
    }

    // Bearing Lock & Optical Iris Fly-Through directly into the live homepage
    function enterSite(e) {
      if (e) {
        // Allow modifier clicks (e.g. Cmd/Ctrl+click to open in new tab) to work normally
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (e.button && e.button !== 0)) {
          return;
        }
        e.preventDefault();
      }
      if (isEntering) return;
      isEntering = true;

      const targetUrl = (enterBtn && enterBtn.getAttribute('href')) || 'index.html';

      if (reducedMotion.matches) {
        document.body.classList.add('is-leaving');
        setTimeout(function () {
          window.location.href = targetUrl;
        }, 160);
        return;
      }

      if (medallion) {
        const rect = medallion.getBoundingClientRect();
        const cx = ((rect.left + rect.width / 2) / window.innerWidth * 100).toFixed(2) + '%';
        const cy = ((rect.top + rect.height / 2) / window.innerHeight * 100).toFixed(2) + '%';
        document.documentElement.style.setProperty('--iris-x', cx);
        document.documentElement.style.setProperty('--iris-y', cy);
        medallion.style.transform = '';
        medallion.style.animation = '';
      }

      document.body.classList.add('is-entering');

      // Open the optical iris directly through the centre of the RG compass as it launches forward
      setTimeout(function () {
        document.body.classList.add('is-iris-open');
      }, 280);

      setTimeout(function () {
        window.location.replace(targetUrl);
      }, 1020);
    }

    if (enterBtn) {
      enterBtn.addEventListener('click', enterSite);
      enterBtn.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          enterSite();
        }
      });
    }
  })();
</script>

</body>
</html>
