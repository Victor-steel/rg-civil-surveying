<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070b0d" />
  <title>RG Civil Engineering &amp; Surveying · Mobile Welcome Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #070b0d;
      --paper: #f4f6f8;
      --gold: #f5cf25;
      --gold-warm: #e5b916;
      --muted: rgba(244, 246, 248, 0.9);
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    .mobile-welcome {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 20px;
      isolation: isolate;
      overflow: hidden;
    }

    .portal-veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--ink);
      overflow: hidden;
      pointer-events: none;
    }

    /* Real 9:16 Google Flow video background */
    .gl-stage {
      position: absolute;
      inset: -1.5%;
      width: 103%;
      height: 103%;
      will-change: transform;
    }

    .flow-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 88% 50%;
      filter: contrast(1.03) saturate(1.03) brightness(0.98);
    }

    /* Subtle central text scrim keeping tripod, river & fells clear */
    .mobile-backdrop {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 84% 34% at 50% 60%,
          rgba(7, 11, 13, 0.54) 0%,
          rgba(7, 11, 13, 0.26) 56%,
          transparent 88%
        ),
        linear-gradient(
          180deg,
          rgba(7, 11, 13, 0.14) 0%,
          transparent 24%,
          transparent 74%,
          rgba(7, 11, 13, 0.42) 100%
        );
    }

    /* Preloaded homepage portal behind compass */
    .home-portal-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      clip-path: circle(0px at 50% 50%);
      background: #0d1214;
      overflow: hidden;
    }

    .home-portal-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d1214;
      transform: scale(0.82);
      will-change: transform;
    }

    /* Exact vertical mobile focal stack */
    .mobile-center {
      position: relative;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 520px;
      padding-bottom: clamp(22px, 5vh, 48px);
    }

    .compass-emblem-stage {
      position: relative;
      width: clamp(164px, 43vw, 198px);
      height: clamp(164px, 43vw, 198px);
      margin-bottom: 14px;
      perspective: 900px;
      user-select: none;
    }

    .compass-medallion-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      animation: compassFloat 7.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.48));
    }

    @keyframes compassFloat {
      0% { transform: translate3d(0, 2px, 0) rotateX(2deg) rotateY(-2.2deg); }
      100% { transform: translate3d(0, -4px, 0) rotateX(-2deg) rotateY(2.2deg); }
    }

    .compass-base-img,
    .compass-relief-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }
    .compass-base-img { transform: translateZ(0px); }
    .compass-relief-img {
      transform: translateZ(4px);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .compass-transition-ring {
      position: absolute;
      inset: -24%;
      width: 148%;
      height: 148%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.84) rotate(-42deg);
      transition:
        opacity 0.2s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-heading {
      font-size: clamp(1.65rem, 6.7vw, 2.25rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--paper);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.78), 0 1px 4px rgba(0, 0, 0, 0.65);
      margin-bottom: 8px;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-heading span {
      display: block;
      color: var(--gold);
    }

    .welcome-tagline {
      font-size: clamp(0.84rem, 3.6vw, 0.98rem);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--muted);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      margin-bottom: 24px;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .enter-site-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #f8d63a 0%, var(--gold) 55%, var(--gold-warm) 100%);
      color: #070b0d;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: 0.02em;
      padding: 14px 30px;
      min-width: 196px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.52),
        0 4px 14px rgba(245, 207, 37, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition:
        opacity 0.2s ease,
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-arrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 500;
    }

    body.is-entering .welcome-heading,
    body.is-entering .welcome-tagline,
    body.is-entering .enter-site-btn {
      opacity: 0;
      transform: translateY(14px) scale(0.97);
      pointer-events: none;
    }
    body.is-entering .welcome-tagline { transition-delay: 0.03s; }
    body.is-entering .enter-site-btn { transition-delay: 0.06s; }
    body.is-entering .mobile-backdrop { opacity: 0.15; transition: opacity 0.3s ease; }
    body.is-entering .compass-transition-ring {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      transition: opacity 0.16s ease, transform 0.34s cubic-bezier(0.2, 1.2, 0.35, 1);
    }
    body.is-entering .compass-medallion-3d {
      animation: compassBearingLock 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    body.is-entering .compass-relief-img { transform: translateZ(18px); }
    body.is-pushing .compass-medallion-3d { filter: none; }

    @keyframes compassBearingLock {
      0% { transform: scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      42% { transform: scale(0.92) rotateX(14deg) rotateY(-9deg) rotateZ(-12deg); }
      78% { transform: scale(1.03) rotateX(-2deg) rotateY(1deg) rotateZ(1.5deg); }
      100% { transform: scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-stage, .compass-medallion-3d { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="mobile-welcome" aria-labelledby="welcome-heading">
    <div class="portal-veil" id="portalVeil" aria-hidden="true">
      <div class="gl-stage" id="glStage">
        <video
          class="flow-video"
          id="mobileBgVideo"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          poster="assets/video/cumbria-river-survey-mobile-poster.jpg?v=20261118-flow"
          src="assets/video/cumbria-river-survey-mobile.mp4?v=20261118-flow"
        >
          <img
            class="flow-video"
            src="assets/video/cumbria-river-survey-mobile-poster.jpg?v=20261118-flow"
            alt="RG Civil Engineering and Surveying Cumbrian River Survey"
          />
        </video>
      </div>
      <div class="mobile-backdrop"></div>
    </div>

    <div class="home-portal-wrap" id="homePortal" aria-hidden="true">
      <iframe class="home-portal-frame" id="homePortalFrame" data-src="index.html" tabindex="-1" title="RG Civil Engineering Homepage"></iframe>
    </div>

    <div class="mobile-center">
      <div class="compass-emblem-stage" id="compassStage">
        <svg class="compass-transition-ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle cx="120" cy="120" r="108" fill="none" stroke="rgba(245, 207, 37, 0.42)" stroke-width="1" stroke-dasharray="4 6" />
          <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(245, 207, 37, 0.22)" stroke-width="0.75" />
          <line x1="120" y1="2" x2="120" y2="14" stroke="#f5cf25" stroke-width="1.5" />
          <line x1="120" y1="226" x2="120" y2="238" stroke="#f5cf25" stroke-width="1.5" />
          <line x1="2" y1="120" x2="14" y2="120" stroke="#f5cf25" stroke-width="1.5" />
          <line x1="226" y1="120" x2="238" y2="120" stroke="#f5cf25" stroke-width="1.5" />
        </svg>

        <div class="compass-medallion-3d" id="compassMedallion">
          <img
            class="compass-base-img"
            src="assets/brand/rg-logo-compass-cutout-3d.png"
            alt="RG Civil Engineering and Surveying compass logo"
            width="400"
            height="400"
            decoding="async"
          />
          <img
            class="compass-relief-img"
            src="assets/brand/rg-logo-compass-cutout-front.png"
            alt=""
            aria-hidden="true"
            width="400"
            height="400"
            decoding="async"
          />
        </div>
      </div>

      <h1 class="welcome-heading" id="welcome-heading">
        RG Civil Engineering
        <span>&amp; Surveying</span>
      </h1>

      <p class="welcome-tagline">
        Measured on site. Built with confidence.
      </p>

      <a href="index.html" class="enter-site-btn" id="enterSiteBtn">
        <span>Enter site</span>
        <span class="enter-arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </main>

  <script>
    (function () {
      const video = document.getElementById('mobileBgVideo');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      function ensurePlay() {
        if (!video) return;
        if (reducedMotion.matches) {
          video.pause();
          return;
        }
        video.defaultMuted = true;
        video.muted = true;
        video.playsInline = true;
        if (video.paused) video.play().catch(function () {});
      }
      ensurePlay();
      if (video) {
        video.addEventListener('loadeddata', ensurePlay);
        video.addEventListener('canplay', ensurePlay);
      }
      window.addEventListener('touchstart', ensurePlay, { passive: true, once: true });
      if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', ensurePlay);

      // ---- Compass Iris Portal Transition into Homepage ----
      const enterBtn = document.getElementById('enterSiteBtn');
      const compassStage = document.getElementById('compassStage');
      const bearingRing = compassStage.querySelector('.compass-transition-ring');
      const medallion = document.getElementById('compassMedallion');
      const glStage = document.getElementById('glStage');
      const portal = document.getElementById('homePortal');
      const portalFrame = document.getElementById('homePortalFrame');
      let isEntering = false;

      function loadPortal() {
        if (!portalFrame || portalFrame.getAttribute('src')) return;
        portalFrame.setAttribute('src', 'index.html');
      }
      window.addEventListener('load', function () { setTimeout(loadPortal, 400); });
      if (enterBtn) enterBtn.addEventListener('touchstart', loadPortal, { once: true, passive: true });

      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const smooth = (t) => t * t * (3 - 2 * t);

      function enterSite(e) {
        if (e) e.preventDefault();
        if (isEntering) return;
        isEntering = true;

        const targetUrl = 'index.html';
        if (reducedMotion.matches || !compassStage || !portal) {
          window.location.href = targetUrl;
          return;
        }

        const LOCK_MS = 340;
        const OPEN_MS = 220;
        const PUSH_MS = 860;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const sr = compassStage.getBoundingClientRect();
        const cx = sr.left + sr.width / 2;
        const cy = sr.top + sr.height / 2;
        const r0 = sr.width * 0.24;
        const GAP_X = 0.541;
        const GAP_Y = 0.39;
        const fx = sr.left + sr.width * GAP_X;
        const fy = sr.top + sr.height * GAP_Y;

        function coversAll(s) {
          const pcx = fx + s * (cx - fx);
          const pcy = fy + s * (cy - fy);
          const R = r0 * s;
          return [[0, 0], [vw, 0], [0, vh], [vw, vh]].every((c) => Math.hypot(c[0] - pcx, c[1] - pcy) <= R);
        }
        let lo = 1, hi = 2;
        while (!coversAll(hi) && hi < 2000) hi *= 2;
        for (let i = 0; i < 24; i++) {
          const mid = (lo + hi) / 2;
          if (coversAll(mid)) hi = mid; else lo = mid;
        }
        const GAP_CLEAR = 0.069;
        const reachF = Math.hypot(Math.max(fx, vw - fx), Math.max(fy, vh - fy));
        const sClear = Math.max(hi * 1.05, (reachF / (sr.width * GAP_CLEAR)) * 1.04);
        const logMax = Math.log(sClear);
        const pCovered = Math.pow(Math.log(hi * 1.02) / logMax, 1 / 1.75);

        loadPortal();
        let sceneBase = '';
        if (glStage) {
          const ct = window.getComputedStyle(glStage).transform;
          sceneBase = ct && ct !== 'none' ? ct : '';
          glStage.style.animation = 'none';
          glStage.style.transform = sceneBase;
        }

        compassStage.style.transformOrigin = (GAP_X * 100) + '% ' + (GAP_Y * 100) + '%';
        document.body.classList.add('is-entering');

        const t0 = performance.now();
        let pushing = false;
        let navigated = false;
        const go = () => { if (!navigated) { navigated = true; window.location.replace(targetUrl); } };

        function frame(now) {
          const t = now - t0;
          const open = easeOutCubic(clamp01((t - (LOCK_MS - 120)) / OPEN_MS));
          const p = clamp01((t - LOCK_MS) / PUSH_MS);
          const ease = Math.pow(p, 1.75);
          const s = Math.exp(logMax * ease);
          const q = clamp01(p / pCovered);
          const exit = smooth(clamp01((p - pCovered) / (1 - pCovered)));

          if (p > 0 && !pushing) {
            pushing = true;
            document.body.classList.add('is-pushing');
          }

          compassStage.style.transform = 'scale(' + s.toFixed(4) + ')';
          compassStage.style.opacity = (1 - exit).toFixed(3);
          if (bearingRing && p > 0) {
            bearingRing.style.transition = 'none';
            bearingRing.style.opacity = (1 - smooth(clamp01((p - 0.3) / 0.4))).toFixed(3);
          }

          portal.style.clipPath = 'circle(' + (r0 * s * open).toFixed(1) + 'px at ' +
            (fx + s * (cx - fx)).toFixed(1) + 'px ' + (fy + s * (cy - fy)).toFixed(1) + 'px)';
          portalFrame.style.transform = 'scale(' + (0.82 + 0.18 * smooth(q)).toFixed(4) + ')';

          if (glStage) {
            glStage.style.transform = sceneBase + ' scale(' + (1 + 0.25 * ease).toFixed(4) + ')';
          }

          if (p < 1) requestAnimationFrame(frame);
          else setTimeout(go, 40);
        }
        requestAnimationFrame(frame);
        setTimeout(go, LOCK_MS + PUSH_MS + 600);
      }

      if (enterBtn) enterBtn.addEventListener('click', enterSite);
    })();
  </script>
</body>
</html>
