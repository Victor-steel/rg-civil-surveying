<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070b0d" />
  <title>RG Civil Engineering &amp; Surveying · Mobile Welcome Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #070b0d;
      --paper: #f4f6f8;
      --gold: #f5cf25;
      --gold-warm: #e5b916;
      --muted: rgba(244, 246, 248, 0.9);
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    .mobile-welcome {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 20px;
      isolation: isolate;
      overflow: hidden;
    }

    .portal-veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--ink);
      overflow: hidden;
      pointer-events: none;
    }

    /* Live WebGL living photograph stage (locked tripod camera, only water & clouds move) */
    .gl-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #glCanvas, .fallback-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .fallback-photo {
      object-fit: cover;
      object-position: 92% 50%;
    }

    /* Subtle central text scrim keeping tripod, river & fells clear */
    .mobile-backdrop {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 84% 34% at 50% 60%,
          rgba(7, 11, 13, 0.54) 0%,
          rgba(7, 11, 13, 0.26) 56%,
          transparent 88%
        ),
        linear-gradient(
          180deg,
          rgba(7, 11, 13, 0.14) 0%,
          transparent 24%,
          transparent 74%,
          rgba(7, 11, 13, 0.42) 100%
        );
    }

    /* Preloaded homepage portal behind compass */
    .home-portal-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      clip-path: circle(0px at 50% 50%);
      background: #0d1214;
      overflow: hidden;
    }

    .home-portal-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d1214;
      transform: scale(0.82);
      will-change: transform;
    }

    /* Exact vertical mobile focal stack */
    .mobile-center {
      position: relative;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 520px;
      padding-bottom: clamp(22px, 5vh, 48px);
    }

    .compass-emblem-stage {
      position: relative;
      width: clamp(164px, 43vw, 198px);
      height: clamp(164px, 43vw, 198px);
      margin-bottom: 14px;
      perspective: 900px;
      user-select: none;
    }

    .compass-medallion-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      animation: compassFloat 7.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.48));
    }

    @keyframes compassFloat {
      0% { transform: translate3d(0, 2px, 0) rotateX(2deg) rotateY(-2.2deg); }
      100% { transform: translate3d(0, -4px, 0) rotateX(-2deg) rotateY(2.2deg); }
    }

    .compass-base-img,
    .compass-relief-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }
    .compass-base-img { transform: translateZ(0px); }
    .compass-relief-img {
      transform: translateZ(4px);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .compass-transition-ring {
      position: absolute;
      inset: -24%;
      width: 148%;
      height: 148%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.84) rotate(-42deg);
      transition:
        opacity 0.2s ease,
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-heading {
      font-size: clamp(1.65rem, 6.7vw, 2.25rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--paper);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.78), 0 1px 4px rgba(0, 0, 0, 0.65);
      margin-bottom: 8px;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-heading span {
      display: block;
      color: var(--gold);
    }

    .welcome-tagline {
      font-size: clamp(0.84rem, 3.6vw, 0.98rem);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--muted);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      margin-bottom: 24px;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .enter-site-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #f8d63a 0%, var(--gold) 55%, var(--gold-warm) 100%);
      color: #070b0d;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: 0.02em;
      padding: 14px 30px;
      min-width: 196px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.52),
        0 4px 14px rgba(245, 207, 37, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition:
        opacity 0.2s ease,
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-arrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 500;
    }

    body.is-entering .welcome-heading,
    body.is-entering .welcome-tagline,
    body.is-entering .enter-site-btn {
      opacity: 0;
      transform: translateY(14px) scale(0.97);
      pointer-events: none;
    }
    body.is-entering .welcome-tagline { transition-delay: 0.03s; }
    body.is-entering .enter-site-btn { transition-delay: 0.06s; }
    body.is-entering .mobile-backdrop { opacity: 0.15; transition: opacity 0.3s ease; }
    body.is-entering .compass-transition-ring {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      transition: opacity 0.16s ease, transform 0.34s cubic-bezier(0.2, 1.2, 0.35, 1);
    }
    body.is-entering .compass-medallion-3d {
      animation: compassBearingLock 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    body.is-entering .compass-relief-img { transform: translateZ(18px); }
    body.is-pushing .compass-medallion-3d { filter: none; }

    @keyframes compassBearingLock {
      0% { transform: scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      42% { transform: scale(0.92) rotateX(14deg) rotateY(-9deg) rotateZ(-12deg); }
      78% { transform: scale(1.03) rotateX(-2deg) rotateY(1deg) rotateZ(1.5deg); }
      100% { transform: scale(1) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-stage, .compass-medallion-3d { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="mobile-welcome" aria-labelledby="welcome-heading">
    <div class="portal-veil" id="portalVeil" aria-hidden="true">
      <div class="gl-stage" id="glStage">
        <img
          class="fallback-photo"
          src="assets/generated/cumbria-river-survey-mobile-clean.jpg"
          alt="RG Civil Engineering and Surveying Cumbrian River Survey"
        />
        <canvas id="glCanvas"></canvas>
      </div>
      <div class="mobile-backdrop"></div>
    </div>

    <div class="home-portal-wrap" id="homePortal" aria-hidden="true">
      <iframe class="home-portal-frame" id="homePortalFrame" data-src="index.html" tabindex="-1" title="RG Civil Engineering Homepage"></iframe>
    </div>

    <div class="mobile-center">
      <div class="compass-emblem-stage" id="compassStage">
        <svg class="compass-transition-ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle cx="120" cy="120" r="108" fill="none" stroke="rgba(245, 207, 37, 0.42)" stroke-width="1" stroke-dasharray="4 6" />
          <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(245, 207, 37, 0.22)" stroke-width="0.75" />
          <line x1="120" y1="2" x2="120" y2="14" stroke="#f5cf25" stroke-width="1.5" />
          <line x1="120" y1="226" x2="120" y2="238" stroke="#f5cf25" stroke-width="1.5" />
          <line x1="2" y1="120" x2="14" y2="120" stroke="#f5cf25" stroke-width="1.5" />
          <line x1="226" y1="120" x2="238" y2="120" stroke="#f5cf25" stroke-width="1.5" />
        </svg>

        <div class="compass-medallion-3d" id="compassMedallion">
          <img
            class="compass-base-img"
            src="assets/brand/rg-logo-compass-cutout-3d.png"
            alt="RG Civil Engineering and Surveying compass logo"
            width="400"
            height="400"
            decoding="async"
          />
          <img
            class="compass-relief-img"
            src="assets/brand/rg-logo-compass-cutout-front.png"
            alt=""
            aria-hidden="true"
            width="400"
            height="400"
            decoding="async"
          />
        </div>
      </div>

      <h1 class="welcome-heading" id="welcome-heading">
        RG Civil Engineering
        <span>&amp; Surveying</span>
      </h1>

      <p class="welcome-tagline">
        Measured on site. Built with confidence.
      </p>

      <a href="index.html" class="enter-site-btn" id="enterSiteBtn">
        <span>Enter site</span>
        <span class="enter-arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById('glCanvas');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const gl = canvas.getContext('webgl', { alpha: false, antialias: true, powerPreference: 'high-performance' });

      if (gl && !reducedMotion.matches) {
        const vsSrc = `
          attribute vec2 a_pos;
          varying vec2 v_uv;
          void main() {
            v_uv = a_pos * 0.5 + 0.5;
            gl_Position = vec4(a_pos, 0.0, 1.0);
          }
        `;

        const fsSrc = `
          precision highp float;
          varying vec2 v_uv;
          uniform sampler2D u_photo;
          uniform sampler2D u_masks;
          uniform vec2 u_res;
          uniform vec2 u_img;
          uniform float u_time;

          float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
            for (int i = 0; i < 4; i++) {
              v += a * noise(p);
              p = rot * p * 2.04;
              a *= 0.5;
            }
            return v;
          }

          // Exact cover projection matching object-position: 92% 50%
          vec2 coverUV(vec2 screenUV) {
            float rView = u_res.x / max(u_res.y, 1.0);
            float rImg = u_img.x / max(u_img.y, 1.0);
            vec2 scale = vec2(1.0);
            if (rView < rImg) {
              scale.x = rView / rImg;
            } else {
              scale.y = rImg / rView;
            }
            vec2 align = vec2(0.92, 0.5);
            // Invert Y so (0,0) = top-left in image texture space (UNPACK_FLIP_Y_WEBGL = true uses v=1 top)
            return vec2(
              (screenUV.x - align.x) * scale.x + align.x,
              1.0 - ((1.0 - screenUV.y - align.y) * scale.y + align.y)
            );
          }

          void main() {
            vec2 uv = coverUV(v_uv);
            vec4 baseCol = texture2D(u_photo, uv);
            vec3 m = texture2D(u_masks, uv).rgb;
            float waterMask = m.r;
            float depth = m.g;
            float skyMask = m.b;

            vec3 col = baseCol.rgb;

            // --- 1. CONTINUOUS NATURAL RIVER FLOW (Zero double-exposure ghosting) ---
            if (waterMask > 0.005) {
              // Perspective-scaled directional surface coordinates along river flow
              // In texture space (v=1 top, v=0 bottom): downstream = (-x, -y), so sample upstream (+x, +y)
              float pScale = mix(24.0, 8.0, depth);
              vec2 flowVec = vec2(0.55, 0.84);
              vec2 flowP = uv * vec2(pScale, pScale * 1.85) + flowVec * (u_time * mix(0.85, 2.05, depth));
              vec2 flowP2 = uv * vec2(pScale * 1.55, pScale * 2.4) + vec2(0.32, 0.94) * (u_time * mix(1.05, 2.55, depth));

              float n1 = fbm(flowP);
              float n2 = fbm(flowP2);
              float eps = 0.038;
              float nx = fbm(flowP + vec2(eps, 0.0)) - n1;
              float ny = fbm(flowP + vec2(0.0, eps)) - n1;

              // Crisp optical water refraction along wave normals (keeps rocks sharp)
              float refractAmp = mix(0.0016, 0.0052, depth) * waterMask;
              vec2 ruv = clamp(uv + vec2(nx, ny) * refractAmp * 16.0, vec2(0.001), vec2(0.999));

              // Tight dual-phase downstream current advection (zero smudgy crossfade)
              float cyc1 = fract(u_time * 0.34);
              float cyc2 = fract(cyc1 + 0.5);
              float w1 = 1.0 - abs(2.0 * cyc1 - 1.0);
              w1 = w1 * w1 * (3.0 - 2.0 * w1);
              float throwAmt = mix(0.0045, 0.0145, depth) * waterMask;
              vec2 adv1 = clamp(ruv + flowVec * ((cyc1 - 0.5) * throwAmt), vec2(0.001), vec2(0.999));
              vec2 adv2 = clamp(ruv + flowVec * ((cyc2 - 0.5) * throwAmt), vec2(0.001), vec2(0.999));

              vec3 waterSample = mix(texture2D(u_photo, adv2).rgb, texture2D(u_photo, adv1).rgb, w1);

              // Directional sky reflection glint & streaming whitewater crests
              float luma = dot(waterSample, vec3(0.299, 0.587, 0.114));
              float crest = smoothstep(0.38, 0.78, n1 * 0.58 + n2 * 0.42);
              float foamCatch = smoothstep(0.20, 0.62, luma);
              vec3 glintCol = mix(vec3(0.76, 0.84, 0.90), vec3(0.97, 0.99, 1.0), foamCatch);
              waterSample = mix(waterSample, glintCol, crest * (0.11 + 0.16 * foamCatch) * waterMask);
              waterSample *= 1.0 + (n2 - 0.5) * 0.19 * waterMask;

              col = mix(col, waterSample, waterMask);
            }

            // --- 2. NATURAL OVERCAST SKY CLOUD DRIFT (Strictly above fell ridge) ---
            if (skyMask > 0.005) {
              // Continuous horizontal overcast billow drift (zero sharp cutoff, locked mountain edge)
              vec2 skyCoord = uv * vec2(3.2, 5.0) + vec2(-u_time * 0.095, u_time * 0.012);
              vec2 skyDetail = uv * vec2(6.4, 9.2) + vec2(-u_time * 0.145, u_time * 0.018);
              float c1 = fbm(skyCoord);
              float c2 = fbm(skyDetail);
              float cloudWave = (c1 * 0.68 + c2 * 0.32) - 0.5;

              // Continuous gentle horizontal sky shear using tight phase advection in upper overcast
              float upperSky = skyMask * smoothstep(0.76, 0.94, uv.y);
              float sc1 = fract(u_time * 0.09);
              float sc2 = fract(sc1 + 0.5);
              float sw1 = 1.0 - abs(2.0 * sc1 - 1.0);
              sw1 = sw1 * sw1 * (3.0 - 2.0 * sw1);
              float cThrow = 0.022 * upperSky;
              vec3 skyBase = mix(
                texture2D(u_photo, clamp(uv + vec2(-(sc2 - 0.5) * cThrow, 0.0), vec2(0.001), vec2(0.999))).rgb,
                texture2D(u_photo, clamp(uv + vec2(-(sc1 - 0.5) * cThrow, 0.0), vec2(0.001), vec2(0.999))).rgb,
                sw1
              );

              // Deepen storm billows & brighten overcast breaks subtly in matching cool slate palette
              vec3 darkStorm = skyBase * vec3(0.78, 0.82, 0.87);
              vec3 lightBreak = min(vec3(1.0), skyBase * vec3(1.22, 1.23, 1.24) + vec3(0.04));
              vec3 modSky = mix(darkStorm, lightBreak, smoothstep(-0.20, 0.22, cloudWave));

              col = mix(col, modSky, skyMask * 0.84);
            }

            gl_FragColor = vec4(col, 1.0);
          }
        `;

        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        }
        const prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'a_pos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(prog, 'u_res');
        const uImg = gl.getUniformLocation(prog, 'u_img');
        const uTime = gl.getUniformLocation(prog, 'u_time');
        const uPhotoLoc = gl.getUniformLocation(prog, 'u_photo');
        const uMaskLoc = gl.getUniformLocation(prog, 'u_masks');

        let loadedCount = 0;
        let imgW = 1080, imgH = 1920;

        function loadTex(unit, url, onReady) {
          const tex = gl.createTexture();
          const img = new Image();
          img.onload = function () {
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
            loadedCount++;
            if (onReady) onReady(img);
          };
          img.src = url;
        }

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(canvas.clientWidth * dpr);
          canvas.height = Math.round(canvas.clientHeight * dpr);
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        loadTex(0, 'assets/generated/cumbria-river-survey-mobile-clean.jpg', function (im) {
          imgW = im.naturalWidth || 1080;
          imgH = im.naturalHeight || 1920;
        });
        loadTex(1, 'assets/generated/cumbria-river-survey-mobile-masks.png');

        gl.uniform1i(uPhotoLoc, 0);
        gl.uniform1i(uMaskLoc, 1);

        const startT = performance.now();
        function draw(now) {
          if (loadedCount === 2) {
            gl.uniform2f(uRes, canvas.width, canvas.height);
            gl.uniform2f(uImg, imgW, imgH);
            gl.uniform1f(uTime, (now - startT) * 0.001);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      } else {
        canvas.style.display = 'none';
      }

      // ---- Compass Iris Portal Transition into Homepage ----
      const enterBtn = document.getElementById('enterSiteBtn');
      const compassStage = document.getElementById('compassStage');
      const bearingRing = compassStage.querySelector('.compass-transition-ring');
      const medallion = document.getElementById('compassMedallion');
      const glStage = document.getElementById('glStage');
      const portal = document.getElementById('homePortal');
      const portalFrame = document.getElementById('homePortalFrame');
      let isEntering = false;

      function loadPortal() {
        if (!portalFrame || portalFrame.getAttribute('src')) return;
        portalFrame.setAttribute('src', 'index.html');
      }
      window.addEventListener('load', function () { setTimeout(loadPortal, 400); });
      if (enterBtn) enterBtn.addEventListener('touchstart', loadPortal, { once: true, passive: true });

      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const smooth = (t) => t * t * (3 - 2 * t);

      function enterSite(e) {
        if (e) e.preventDefault();
        if (isEntering) return;
        isEntering = true;

        const targetUrl = 'index.html';
        if (reducedMotion.matches || !compassStage || !portal) {
          window.location.href = targetUrl;
          return;
        }

        const LOCK_MS = 340;
        const OPEN_MS = 220;
        const PUSH_MS = 860;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const sr = compassStage.getBoundingClientRect();
        const cx = sr.left + sr.width / 2;
        const cy = sr.top + sr.height / 2;
        const r0 = sr.width * 0.24;
        const GAP_X = 0.541;
        const GAP_Y = 0.39;
        const fx = sr.left + sr.width * GAP_X;
        const fy = sr.top + sr.height * GAP_Y;

        function coversAll(s) {
          const pcx = fx + s * (cx - fx);
          const pcy = fy + s * (cy - fy);
          const R = r0 * s;
          return [[0, 0], [vw, 0], [0, vh], [vw, vh]].every((c) => Math.hypot(c[0] - pcx, c[1] - pcy) <= R);
        }
        let lo = 1, hi = 2;
        while (!coversAll(hi) && hi < 2000) hi *= 2;
        for (let i = 0; i < 24; i++) {
          const mid = (lo + hi) / 2;
          if (coversAll(mid)) hi = mid; else lo = mid;
        }
        const GAP_CLEAR = 0.069;
        const reachF = Math.hypot(Math.max(fx, vw - fx), Math.max(fy, vh - fy));
        const sClear = Math.max(hi * 1.05, (reachF / (sr.width * GAP_CLEAR)) * 1.04);
        const logMax = Math.log(sClear);
        const pCovered = Math.pow(Math.log(hi * 1.02) / logMax, 1 / 1.75);

        loadPortal();
        let sceneBase = '';
        if (glStage) {
          const ct = window.getComputedStyle(glStage).transform;
          sceneBase = ct && ct !== 'none' ? ct : '';
          glStage.style.animation = 'none';
          glStage.style.transform = sceneBase;
        }

        compassStage.style.transformOrigin = (GAP_X * 100) + '% ' + (GAP_Y * 100) + '%';
        document.body.classList.add('is-entering');

        const t0 = performance.now();
        let pushing = false;
        let navigated = false;
        const go = () => { if (!navigated) { navigated = true; window.location.replace(targetUrl); } };

        function frame(now) {
          const t = now - t0;
          const open = easeOutCubic(clamp01((t - (LOCK_MS - 120)) / OPEN_MS));
          const p = clamp01((t - LOCK_MS) / PUSH_MS);
          const ease = Math.pow(p, 1.75);
          const s = Math.exp(logMax * ease);
          const q = clamp01(p / pCovered);
          const exit = smooth(clamp01((p - pCovered) / (1 - pCovered)));

          if (p > 0 && !pushing) {
            pushing = true;
            document.body.classList.add('is-pushing');
          }

          compassStage.style.transform = 'scale(' + s.toFixed(4) + ')';
          compassStage.style.opacity = (1 - exit).toFixed(3);
          if (bearingRing && p > 0) {
            bearingRing.style.transition = 'none';
            bearingRing.style.opacity = (1 - smooth(clamp01((p - 0.3) / 0.4))).toFixed(3);
          }

          portal.style.clipPath = 'circle(' + (r0 * s * open).toFixed(1) + 'px at ' +
            (fx + s * (cx - fx)).toFixed(1) + 'px ' + (fy + s * (cy - fy)).toFixed(1) + 'px)';
          portalFrame.style.transform = 'scale(' + (0.82 + 0.18 * smooth(q)).toFixed(4) + ')';

          if (glStage) {
            glStage.style.transform = sceneBase + ' scale(' + (1 + 0.25 * ease).toFixed(4) + ')';
          }

          if (p < 1) requestAnimationFrame(frame);
          else setTimeout(go, 40);
        }
        requestAnimationFrame(frame);
        setTimeout(go, LOCK_MS + PUSH_MS + 600);
      }

      if (enterBtn) enterBtn.addEventListener('click', enterSite);
    })();
  </script>
</body>
</html>
